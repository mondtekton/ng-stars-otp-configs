spring:
  cloud:
    gateway:
      routes:
        - id: otp
          uri: lb://otp
          predicates:
            - Path=/otp/**
        - id: email
          uri: lb://email
          predicates:
            - Path=/email/**

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9293/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: ["prometheus"]
